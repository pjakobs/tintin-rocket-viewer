<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tintin Moon Rocket — 3D Digital Twin</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(20, 22, 28, 0.72); color: #e8eaf0;
        padding: 12px 14px; border-radius: 10px; backdrop-filter: blur(6px);
        font-size: 13px; line-height: 1.5; max-width: 280px;
        border: 1px solid rgba(255,255,255,0.08);
      }
      #hud h1 { font-size: 14px; margin-bottom: 4px; letter-spacing: 0.2px; }
      #hud .meta { color: #9aa0ac; font-size: 12px; }
      #hud .row { display: flex; justify-content: space-between; gap: 12px; }
      #hud .row span:last-child { color: #7dd3fc; font-variant-numeric: tabular-nums; }

      #loading {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: #0b0d12; color: #e8eaf0; transition: opacity 0.4s;
      }
      #loading .bar { width: 240px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 12px; overflow: hidden; }
      #loading .bar > div { height: 100%; width: 0%; background: #7dd3fc; transition: width 0.15s; }
      #loading.hidden { opacity: 0; pointer-events: none; }

      #controls {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
        display: flex; align-items: center; gap: 18px;
        background: rgba(20, 22, 28, 0.72); color: #e8eaf0;
        padding: 12px 18px; border-radius: 12px; backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,0.08); font-size: 12px;
        opacity: 0; pointer-events: none; transition: opacity 0.4s;
      }
      #controls.ready { opacity: 1; pointer-events: auto; }
      #controls .ctl { display: flex; flex-direction: column; gap: 4px; }
      #controls .ctl-row { display: flex; justify-content: space-between; gap: 12px; }
      #controls label { color: #9aa0ac; letter-spacing: 0.3px; }
      #controls .val { color: #7dd3fc; font-variant-numeric: tabular-nums; }
      #controls input[type=range] { width: 200px; accent-color: #7dd3fc; cursor: pointer; }
      #controls button {
        background: rgba(125,211,252,0.14); color: #cfe9fb; border: 1px solid rgba(125,211,252,0.35);
        border-radius: 8px; padding: 7px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
      }
      #controls button:hover { background: rgba(125,211,252,0.24); }
      #controls .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,0.1); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1>Tintin Moon Rocket <span class="meta">· 21367</span></h1>
      <div class="meta" id="status">Initialising…</div>
      <div class="row"><span>Bricks (LDR)</span><span id="stat-bricks">—</span></div>
      <div class="row"><span>Manual CSV</span><span id="stat-csv">—</span></div>
      <div class="row"><span>Meshes drawn</span><span id="stat-parts">—</span></div>
      <div class="row"><span>Missing parts</span><span id="stat-missing">—</span></div>
      <div class="meta" id="stat-note" style="margin-top:6px"></div>
      <div class="meta" style="margin-top:8px">Drag to orbit · scroll to zoom · right-drag to pan</div>
    </div>
    <div id="controls">
      <div class="ctl">
        <div class="ctl-row"><label>Explode</label><span class="val" id="explode-val">0%</span></div>
        <input id="explode" type="range" min="0" max="100" value="0" />
      </div>
      <div class="sep"></div>
      <div class="ctl">
        <div class="ctl-row"><label>Build step</label><span class="val" id="step-val">—</span></div>
        <input id="step" type="range" min="0" max="360" value="360" />
      </div>
      <button id="play">▶ Play build</button>
    </div>
    <div id="loading">
      <div>
        <div style="text-align:center">Loading LEGO model…</div>
        <div class="bar"><div id="progress"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
